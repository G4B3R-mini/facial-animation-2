name: Build Unity package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source package
        run: python scripts/build_unity_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: TripoFaceRig-Unity
          path: dist/TripoFaceRig-Unity.unitypackage
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/TripoFaceRig-Unity.unitypackage --clobber
